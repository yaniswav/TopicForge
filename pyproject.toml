[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "topicforge"
version = "0.6.4"
description = "ROS Topic Inspector & Bag Analyzer MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yanis ETHVIGNOT", email = "ethvignot.yanis@gmail.com" }]
keywords = ["mcp", "ros2", "robotics", "ai", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.6",
    "pyyaml>=6",
    # Bag reader behind `peek_bag_samples`, core since 0.6.4 (it used to be the `[bags]`
    # extra, which `uvx topicforge` and the plugin never selected). Pure Python
    # (py3-none-any wheel); its dependencies apsw, lz4, numpy, zstandard and ruamel.yaml
    # all ship wheels for linux-aarch64 and CPython 3.14 (checked on PyPI 2026-10-08), so
    # no platform marker is needed.
    "rosbags>=0.11.3",
    # Cyclone DDS binding, core since 0.6.3 so that `uvx topicforge` (no extra) can join a
    # DDS bus. The marker lists exactly the platforms where cyclonedds 11.0.1 ships wheels
    # (checked on PyPI 2026-10-07): CPython 3.10-3.13 on Linux x86_64, Windows AMD64 and
    # macOS (x86_64 and arm64). Anywhere else (Linux aarch64, Python 3.14, Windows ARM64)
    # pip would try to build the sdist, which needs the Cyclone C library and fails, so the
    # dependency is skipped there and the server reports why in `dds_inactive_reason`.
    'cyclonedds>=0.10; python_version < "3.14" and ((platform_system == "Linux" and platform_machine == "x86_64") or (platform_system == "Windows" and platform_machine == "AMD64") or platform_system == "Darwin")',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# DDS extras. Only bindings that are actually published on PyPI and used by
# a working adapter are declared here.
#
# 0.5.3 removed `[dds-fast]`, `[dds-opendds]`, `[dds-dust]` and
# `[dds-all-oss]`. `fastdds` and `dust-dds-python` do not exist on PyPI, so
# those extras failed to install, and an unclaimed package name in a published
# extra is a dependency-confusion risk: anyone could register it. `pyopendds`
# exists but no OpenDDS adapter ships any more (removed in 0.7.0).
# Fast DDS still works if its Python binding is built from eProsima's sources;
# see docs/DDS_QUICKSTART.md. Do not add a name here without checking it
# resolves on PyPI and belongs to the upstream project.
#
# `[dds]` and `[dds-cyclone]` are kept as aliases since 0.6.3 (cyclonedds became a core
# dependency on supported platforms) so existing `topicforge[dds]` commands keep working.
# They deliberately list cyclonedds WITHOUT the platform marker: a user on an unsupported
# platform (Linux aarch64, Python 3.14) who has the Cyclone C library installed can still opt
# in with `pip install "topicforge[dds]"` and build the binding from source.
dds-cyclone = [
    "cyclonedds>=0.10",
]
dds = [
    "topicforge[dds-cyclone]",
]
# `[bags]` is kept as an alias since 0.6.4 (rosbags became a core dependency, so a plain
# install can run `peek_bag_samples`) so existing `topicforge[bags]` commands keep working.
bags = []
all = [
    "topicforge[dds]",
]

[project.scripts]
topicforge = "topicforge.__main__:main"

[project.urls]
Homepage = "https://github.com/yaniswav/TopicForge"
Repository = "https://github.com/yaniswav/TopicForge"
Issues = "https://github.com/yaniswav/TopicForge/issues"
Changelog = "https://github.com/yaniswav/TopicForge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/topicforge"]

[tool.hatch.build.targets.sdist]
include = ["src/topicforge", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = [".claude", "docs/projet-file/**", "docs/projet-file", "tests/fixtures/bags/**", "CLAUDE.md", "*.pdf", ".pytest_cache", "pytest-cache-files-*", "pro", "mcpb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
pythonpath = ["src"]
markers = [
    "requires_cyclonedds: tests needing the `cyclonedds` Python bindings; auto-skip without them",
    "requires_fastdds: tests needing the `fastdds` Python bindings; auto-skip without them",
    "integration: real-bus DDS scenarios; deselected by default via addopts, select with `-m integration`",
    "requires_rosbags: tests needing the `rosbags` Python library; auto-skip without it (v0.4.0 Phase 3+)",
]

[tool.coverage.run]
branch = true
source = ["topicforge"]
omit = [
    # The two real DDS adapters import their vendor binding (cyclonedds /
    # fastdds) at module top level, so they are structurally unreachable
    # without those SDKs installed. Their pure logic was extracted into
    # adapters/common/{dds_introspection,qos_normalize,cdr_decoder}.py
    # (Lot 0) which IS measured here; the thin binding shells are exercised
    # only under the `-m integration` real-bus tier. Excluded so the
    # coverage gate reflects testable code rather than being dragged down
    # by lines no unit run can reach.
    "*/adapters/dds_cyclone/adapter.py",
    "*/adapters/dds_fast/adapter.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Threshold reflects the unit-testable surface (the two binding shells are
# omitted above). Baseline at the Lot 0 achieved floor (87% total); the
# extracted pure modules (qos_normalize, dds_introspection) are ~100%, while
# factory.py / bag_service.py binding-present branches stay uncovered without
# the SDKs installed. Ratchet upward as those get tests; do not lower without
# a note in the changelog.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# ruff >= 0.16 also formats Python blocks inside Markdown. The examples'
# READMEs align their comments on purpose, so Markdown stays out of it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Note: TC (typing-only imports) rules are intentionally omitted: Pydantic
# models and `@runtime_checkable` Protocols need runtime imports, and the
# TYPE_CHECKING dance buys us nothing here.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# test_cyclone_adapter.py and test_fast_adapter.py gate their imports
# behind `pytest.importorskip` at module top, so adapter imports must
# come after: E402 is intentional.
"tests/test_cyclone_adapter.py" = ["B011", "E402"]
"tests/test_fast_adapter.py" = ["B011", "E402"]
# Each example is a standalone script that puts examples/dds on sys.path
# before importing the shared harness.
"examples/dds/*/run.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
