name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint + format + tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # 3.14 has no cyclonedds wheel: the suite runs there with the binding absent.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check src tests examples scripts

      - name: Format check (ruff format --check)
        run: python -m ruff format --check src tests examples scripts

      # --cov makes the `fail_under` floor in pyproject.toml actually apply.
      # Without it the threshold was configuration nobody enforced.
      - name: Tests (pytest + coverage floor)
        run: python -m pytest -q --cov=topicforge --cov-report=term

  extras-resolve:
    name: Every declared extra resolves on PyPI
    runs-on: ubuntu-24.04

    # `fastdds` sat in the recommended `[dds]` extra for five releases although
    # no such package exists on PyPI: the install failed, and the unclaimed name
    # was a dependency-confusion risk. This resolves every extra against the
    # live index on each change, so an orphan name cannot ship again.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve each extra without installing
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess, sys, tomllib
          extras = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]
          failed = []
          for name in extras:
              cmd = [sys.executable, "-m", "pip", "install", "--dry-run", "--quiet", f".[{name}]"]
              rc = subprocess.run(cmd).returncode
              print(f"[{'ok' if rc == 0 else 'FAIL'}] .[{name}]")
              if rc:
                  failed.append(name)
          sys.exit(1 if failed else 0)
          PY

  no-cyclone-wheel:
    name: Linux ARM64 without a Cyclone wheel
    runs-on: ubuntu-24.04-arm

    # cyclonedds ships no Linux aarch64 wheel (Jetson, Raspberry Pi). The marker on the
    # dependency in pyproject.toml must make `pip install .` succeed without compiling it,
    # and a server asked for the cyclone backend must answer and explain, not crash.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install from the checkout (no compiler step expected)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: cyclonedds must not be installed
        run: |
          python -c "import importlib.util as u; assert u.find_spec('cyclonedds') is None, 'cyclonedds was installed on aarch64'"

      - name: "Cyclone requested, binding absent: health_check explains"
        env:
          TOPICFORGE_MODE: auto
          TOPICFORGE_DDS_BACKEND: cyclone
        run: |
          python - <<'PY'
          from topicforge.config import load_settings
          from topicforge.server.app import build_app
          from topicforge.services.factory import build_adapter
          from topicforge.services.health import HealthService

          settings = load_settings()
          build_app(settings)
          report = HealthService(settings, build_adapter(settings)).report()
          reason = report.dds_inactive_reason or ""
          print("dds_backend:", report.dds_backend)
          print("dds_inactive_reason:", reason)
          assert "no prebuilt wheel for linux-aarch64" in reason, reason
          PY

  wheel-install:
    name: Built wheel installs from scratch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # The dependency tree changes with the MCP SDK (mcp 2.x pulls pydantic, anyio,
    # httpx2 and mcp-types). This builds the wheel, installs it into an empty venv
    # (no editable install, no dev extras) and starts the entry point, which imports
    # the SDK, so a tree that does not resolve or import on either OS fails here
    # before a release does.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel, install it in a fresh venv, run it
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python - <<'PY'
          import pathlib, subprocess, sys, venv

          wheel = next(pathlib.Path("dist").glob("topicforge-*.whl")).resolve()
          env = pathlib.Path("wheel-venv").resolve()
          venv.create(env, with_pip=True)
          python = env / ("Scripts" if sys.platform == "win32" else "bin") / "python"
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
          subprocess.run([str(python), "-m", "pip", "list"], check=True)
          out = subprocess.run(
              [str(python), "-m", "topicforge", "--version"],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          print(out)
          assert out.startswith("topicforge "), out
          # Importing the server pulls the whole SDK, which `--version` alone may not.
          subprocess.run(
              [str(python), "-c", "from topicforge.server import build_app"], check=True
          )
          PY
        shell: bash
