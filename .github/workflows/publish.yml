name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # dry run: build + smoke only, nothing is published

permissions:
  contents: read

jobs:
  build:
    # No id-token here: this job runs build tooling and must not hold the
    # publishing credential.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - name: Pack the MCP Bundle
        run: |
          VERSION="$(jq -r .version mcpb/manifest.json)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
          mkdir -p mcpb-out
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "mcpb-out/topicforge-${VERSION}.mcpb"
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: mcpb-out/
          if-no-files-found: error

  smoke:
    # Installs the built wheel (not the source tree) in a fresh venv and talks
    # to the server over stdio in mock mode. No ROS needed.
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel in a fresh venv
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ -x smoke-venv/Scripts/python.exe ]; then PY="$PWD/smoke-venv/Scripts/python.exe"; else PY="$PWD/smoke-venv/bin/python"; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Version and entry point
        shell: bash
        run: |
          WHEEL_VERSION="$(ls dist/*.whl | head -n 1 | sed -E 's|.*/topicforge-([^-]+)-.*|\1|')"
          INSTALLED="$("$PY" -c 'import topicforge; print(topicforge.__version__)')"
          echo "wheel=$WHEEL_VERSION installed=$INSTALLED ref=$GITHUB_REF_NAME"
          test "$WHEEL_VERSION" = "$INSTALLED"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$INSTALLED"
          fi
          "$PY" -m topicforge --version
      - name: List tools over stdio (mock mode)
        shell: bash
        env:
          TOPICFORGE_MODE: mock
          TOPICFORGE_DDS_BACKEND: mock
          TOPICFORGE_TELEMETRY: "off"
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cat > "$RUNNER_TEMP/smoke/smoke_stdio.py" <<'PYEOF'
          import asyncio
          import sys

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          EXPECTED_TOOLS = 17


          async def main() -> None:
              params = StdioServerParameters(command=sys.executable, args=["-m", "topicforge"])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = (await session.list_tools()).tools
                      names = sorted(t.name for t in tools)
                      print(len(names), "tools:", ", ".join(names))
                      assert len(names) == EXPECTED_TOOLS, f"expected {EXPECTED_TOOLS} tools"
                      result = await session.call_tool("health_check", {})
                      assert not result.is_error, "health_check returned an error"
                      print("health_check ok")


          asyncio.run(main())
          PYEOF
          # Venv interpreter, run from a directory without the source tree.
          cd "$RUNNER_TEMP/smoke"
          "$PY" smoke_stdio.py

  publish:
    # The only job holding id-token: write. It builds nothing: it uploads the
    # exact artifact the smoke job installed and tested.
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/topicforge
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Publishes server.json to the official MCP Registry. Runs only after the
    # PyPI publish job succeeded, because the registry validates that the
    # pinned package version exists on PyPI.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - name: Check server.json matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SERVER_VERSION="$(jq -r .version server.json)"
          PACKAGE_VERSION="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$TAG_VERSION server.json=$SERVER_VERSION package=$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$SERVER_VERSION"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Wait for the version to be visible on PyPI
        run: |
          VERSION="$(jq -r '.packages[0].version' server.json)"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/topicforge/${VERSION}/json" > /dev/null; then
              echo "topicforge ${VERSION} is on PyPI"
              exit 0
            fi
            echo "waiting for PyPI (${i}/30)"
            sleep 10
          done
          echo "topicforge ${VERSION} not found on PyPI" >&2
          exit 1
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$ARCHIVE" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xzf "$ARCHIVE" mcp-publisher
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  mcpb:
    # Attaches the MCP Bundle (one-click Claude Desktop install, packed in the
    # build job) to the GitHub release of the tag.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload the asset
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: mcpb-out
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FILE="mcpb-out/topicforge-${GITHUB_REF_NAME#v}.mcpb"
          test -f "$FILE"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
