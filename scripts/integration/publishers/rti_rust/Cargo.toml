[package]
name = "rti_rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust / RTI Connector participant for the TopicForge multi-vendor demo"
license = "MIT"

[dependencies]
# RTI Connector for Rust is experimental, not on crates.io (publish = false in
# its own manifest): consume it as a git dependency pinned to a tag.
# v1.5.0 = commit 0677a6a90d67c998f07e56f9950f792c657264ba, the only tag of the
# repository when this file was written. Its build.rs downloads the native
# connectorlibs-1.5.0.zip from github.com/rticommunity/rticonnextdds-connector
# (release v1.5.0) at build time; it needs Rust 1.85+ (edition 2024).
rtiddsconnector = { git = "https://github.com/rticommunity/rticonnextdds-connector-rust", tag = "v1.5.0" }
